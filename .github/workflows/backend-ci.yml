name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: yaam_test
          POSTGRES_USER: yaam
          POSTGRES_PASSWORD: yaam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Format check
        run: dotnet format --verify-no-changes
        working-directory: backend

      - name: Unit tests
        run: dotnet test Yaam.Tests.Unit --no-build --configuration Release
        working-directory: backend

      - name: Integration tests
        run: dotnet test Yaam.Tests.Integration --no-build --configuration Release
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=yaam_test;Username=yaam;Password=yaam"
