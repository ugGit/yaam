<form [formRoot]="fields" class="space-y-4">
  <fieldset class="fieldset">
    <label class="fieldset-legend" for="companyName">Company name *</label>
    <input id="companyName" [formField]="fields.companyName" type="text" class="input" />
    @if (fields.companyName().touched() && fields.companyName().errors().length) {
      <p class="label text-error">{{ fields.companyName().errors()[0].message }}</p>
    }
  </fieldset>

  <fieldset class="fieldset">
    <label class="fieldset-legend" for="role">Role *</label>
    <input id="role" [formField]="fields.role" type="text" class="input" />
    @if (fields.role().touched() && fields.role().errors().length) {
      <p class="label text-error">{{ fields.role().errors()[0].message }}</p>
    }
  </fieldset>

  <fieldset class="fieldset">
    <label class="fieldset-legend" for="status">Status *</label>
    <select id="status" [formField]="fields.status" class="select">
      @for (s of ALL_STATUSES; track s) {
        <option [value]="s">{{ STATUS_LABELS[s] }}</option>
      }
    </select>
  </fieldset>

  <fieldset class="fieldset">
    <label class="fieldset-legend" for="dateApplied">Date applied</label>
    <input id="dateApplied" [formField]="fields.dateApplied" type="date" class="input" />
  </fieldset>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <fieldset class="fieldset">
      <label class="fieldset-legend" for="contactName">Contact name</label>
      <input id="contactName" [formField]="fields.contactName" type="text" class="input" />
    </fieldset>
    <fieldset class="fieldset">
      <label class="fieldset-legend" for="contactEmail">Contact email</label>
      <input id="contactEmail" [formField]="fields.contactEmail" type="email" class="input" />
    </fieldset>
    <fieldset class="fieldset">
      <label class="fieldset-legend" for="contactPhone">Contact phone</label>
      <input id="contactPhone" [formField]="fields.contactPhone" type="text" class="input" />
    </fieldset>
  </div>

  <fieldset class="fieldset">
    <label class="fieldset-legend" for="jobPosting">Job posting</label>
    <textarea id="jobPosting" [formField]="fields.jobPosting" rows="6" class="textarea"></textarea>
  </fieldset>

  <div class="flex gap-2 justify-end">
    <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
  </div>
</form>
