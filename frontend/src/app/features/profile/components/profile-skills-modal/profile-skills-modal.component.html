<dialog #modal class="modal" (close)="onClose()">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">Edit Skills</h3>

    <div class="flex flex-wrap gap-2 mb-4 min-h-8">
      @for (skill of editingSkills(); track skill) {
        <span class="badge badge-outline gap-1">
          {{ skill }}
          <button
            type="button"
            class="btn btn-ghost btn-xs p-0 min-h-0 h-auto"
            (click)="removeSkill(skill)"
            aria-label="Remove {{ skill }}"
          >
            ✕
          </button>
        </span>
      }
      @if (editingSkills().length === 0) {
        <p class="text-base-content/40 italic text-sm">No skills yet — type one below.</p>
      }
    </div>

    <fieldset class="fieldset">
      <label class="fieldset-legend" for="newSkill">Add a skill</label>
      <input
        id="newSkill"
        [formField]="newSkillFields.newSkill"
        type="text"
        class="input w-full"
        placeholder="Type a skill and press Enter"
        (keydown.enter)="onAddSkill($event)"
        (keydown.comma)="onAddSkill($event)"
      />
    </fieldset>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost">Cancel</button>
      </form>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close modal"></button>
  </form>
</dialog>
