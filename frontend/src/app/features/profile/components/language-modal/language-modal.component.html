<dialog #modal class="modal" (close)="onClose()">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Edit' : 'Add' }} Language</h3>

    <div class="flex flex-col gap-3">
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="name">Language *</label>
        <input id="name" [formField]="fields.name" type="text" class="input w-full" />
        @if (fields.name().touched() && fields.name().errors().length) {
          <p class="label text-error">{{ fields.name().errors()[0].message }}</p>
        }
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="proficiency">Proficiency *</label>
        <select id="proficiency" class="select w-full" [formField]="fields.proficiency">
          <option value="">Select proficiency</option>
          @for (p of allProficiencies; track p) {
            <option [value]="p">{{ proficiencyLabels[p] }}</option>
          }
        </select>
        @if (fields.proficiency().touched() && fields.proficiency().errors().length) {
          <p class="label text-error">{{ fields.proficiency().errors()[0].message }}</p>
        }
      </fieldset>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost">Cancel</button>
      </form>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close modal"></button>
  </form>
</dialog>
