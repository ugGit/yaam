<dialog #modal class="modal" (close)="onClose()">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Edit' : 'Add' }} Custom Field</h3>

    <div class="flex flex-col gap-3">
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="cf-label">Label *</label>
        <input id="cf-label" [formField]="fields.label" type="text" class="input w-full" />
        @if (fields.label().touched() && fields.label().errors().length) {
          <p class="label text-error">{{ fields.label().errors()[0].message }}</p>
        }
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="cf-value">Value *</label>
        <textarea
          id="cf-value"
          [formField]="fields.value"
          class="textarea w-full"
          rows="3"
        ></textarea>
        @if (fields.value().touched() && fields.value().errors().length) {
          <p class="label text-error">{{ fields.value().errors()[0].message }}</p>
        }
      </fieldset>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost">Cancel</button>
      </form>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close modal"></button>
  </form>
</dialog>
