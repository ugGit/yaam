<dialog #modal class="modal" (close)="onClose()">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Edit' : 'Add' }} Education</h3>

    <div class="flex flex-col gap-3">
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="institution">Institution *</label>
        <input id="institution" [formField]="fields.institution" type="text" class="input w-full" />
        @if (fields.institution().touched() && fields.institution().errors().length) {
          <p class="label text-error">{{ fields.institution().errors()[0].message }}</p>
        }
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="degree">Degree</label>
        <input id="degree" [formField]="fields.degree" type="text" class="input w-full" />
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="fieldOfStudy">Field of Study</label>
        <input
          id="fieldOfStudy"
          [formField]="fields.fieldOfStudy"
          type="text"
          class="input w-full"
        />
      </fieldset>

      <div class="grid grid-cols-2 gap-3">
        <fieldset class="fieldset">
          <label class="fieldset-legend" for="startDate">Start date</label>
          <input id="startDate" [formField]="fields.startDate" type="date" class="input w-full" />
        </fieldset>

        <fieldset class="fieldset">
          <label class="fieldset-legend" for="endDate">End date</label>
          <input id="endDate" [formField]="fields.endDate" type="date" class="input w-full" />
        </fieldset>
      </div>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost">Cancel</button>
      </form>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close modal"></button>
  </form>
</dialog>
