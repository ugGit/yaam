<dialog #modal class="modal" (close)="onClose()">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Edit' : 'Add' }} Link</h3>

    <div class="flex flex-col gap-3">
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="label">Label *</label>
        <input id="label" [formField]="fields.label" type="text" class="input w-full" />
        @if (fields.label().touched() && fields.label().errors().length) {
          <p class="label text-error">{{ fields.label().errors()[0].message }}</p>
        }
      </fieldset>

      <fieldset class="fieldset">
        <label class="fieldset-legend" for="url">URL *</label>
        <input id="url" [formField]="fields.url" type="text" class="input w-full" />
        @if (fields.url().touched() && fields.url().errors().length) {
          <p class="label text-error">{{ fields.url().errors()[0].message }}</p>
        }
      </fieldset>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost">Cancel</button>
      </form>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close modal"></button>
  </form>
</dialog>
